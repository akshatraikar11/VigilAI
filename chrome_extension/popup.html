<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0a0a0b; /* Darker background */
      --surface: #1a1a1c; /* Elevated surface */
      --surface-hover: #252528; /* Hover state */
      --border: #2a2a2d;
      --primary: #6366f1; /* Modern indigo */
      --primary-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8f8f9; /* Softer white */
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --critical: #ef4444;
      --critical-glow: rgba(239, 68, 68, 0.2);
      --high: #f97316;
      --high-glow: rgba(249, 115, 22, 0.2);
      --medium: #eab308;
      --medium-glow: rgba(234, 179, 8, 0.2);
      --safe: #10b981;
      --safe-glow: rgba(16, 185, 129, 0.2);
      
      --gradient-primary: linear-gradient(135deg, #6366f1, #8b5cf6);
      --gradient-critical: linear-gradient(135deg, #ef4444, #dc2626);
      --gradient-high: linear-gradient(135deg, #f97316, #ea580c);
      --gradient-medium: linear-gradient(135deg, #eab308, #ca8a04);
      --gradient-safe: linear-gradient(135deg, #10b981, #059669);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 380px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.5;
    }

    .container { 
      padding: 24px; 
      background: var(--bg);
      min-height: 500px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo-container {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--primary-glow);
      position: relative;
      overflow: hidden;
    }
    
    .logo-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .logo-container svg { width: 18px; height: 18px; fill: white; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .url-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }
    
    .url-pill:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    .url-icon { 
      color: var(--primary); 
      font-weight: bold; 
      font-size: 14px;
    }

    /* Buttons */
    button {
      width: 100%;
      background: var(--gradient-primary);
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--primary-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--primary-glow);
      filter: brightness(1.1);
    }

    button:disabled {
      background: var(--surface-hover);
      color: var(--text-dim);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    
    button:disabled::before {
      display: none;
    }

    /* Views */
    #loading-view, #results-view { display: none; opacity: 0; transition: opacity 0.3s ease; }
    #loading-view.active, #results-view.active { display: block; opacity: 1; }

    /* Loading Spinner */
    .loader-container {
      text-align: center;
      padding: 40px 0;
    }

    .radar-pulse {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: 3px solid var(--primary);
      margin: 0 auto 20px;
      position: relative;
      animation: pulse 2s infinite;
    }

    .radar-pulse::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 60%; height: 3px;
      background: var(--primary);
      transform-origin: 0 50%;
      animation: scan 1.5s linear infinite;
      border-radius: 2px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--primary-glow); }
      70% { box-shadow: 0 0 0 25px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    @keyframes scan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 12px;
    }
    
    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }
    
    .loading-step {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }
    
    .loading-step.active {
      color: var(--primary);
      opacity: 1;
    }
    
    .loading-step::before {
      content: '○';
      font-size: 10px;
    }
    
    .loading-step.active::before {
      content: '●';
      color: var(--primary);
    }

    /* Results */
    .score-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    
    .score-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-primary);
    }

    .score-circle-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
    }

    svg.progress-ring { width: 80px; height: 80px; transform: rotate(-90deg); }
    .progress-ring__circle {
      fill: transparent;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-ring__bg {
      fill: transparent;
      stroke: var(--surface-hover);
      stroke-width: 8;
    }

    .score-value {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .score-details {
      flex: 1;
      margin-left: 20px;
    }

    .risk-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 0.5px;
    }

    .grade-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.2s ease;
    }
    
    .stat-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
    }

    .stat-val { 
      font-size: 20px; 
      font-weight: 800; 
      margin-bottom: 4px; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .stat-label { 
      font-size: 12px; 
      color: var(--text-muted); 
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .top-findings { margin-bottom: 24px; }
    .top-findings h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 12px 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .finding-tag {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin: 0 8px 8px 0;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    
    .finding-tag:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .footer-link {
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      transition: all 0.2s ease;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .footer-link:hover {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    
    .error-msg {
      color: var(--critical);
      font-size: 13px;
      padding: 12px;
      background: var(--critical-glow);
      border: 1px solid var(--critical);
      border-radius: 12px;
      margin-top: 16px;
      display: none;
      font-weight: 500;
    }
    
    /* Enhanced animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .fade-in-up {
      animation: fadeInUp 0.5s ease-out;
    }
    
    /* Status indicators */
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: blink 2s infinite;
    }
    
    .status-indicator.safe { background: var(--safe); }
    .status-indicator.medium { background: var(--medium); }
    .status-indicator.high { background: var(--high); }
    .status-indicator.critical { background: var(--critical); }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Rescan button styling */
    .rescan-btn {
      background: var(--gradient-primary) !important;
      border: none !important;
      color: white !important;
      padding: 12px 20px !important;
      border-radius: 12px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      transition: all 0.3s ease !important;
      margin-top: 16px !important;
      width: 100% !important;
      font-size: 14px !important;
    }
    
    .rescan-btn:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 25px var(--primary-glow) !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>Vigil AI</h1>
    </header>

    <div class="url-pill">
      <span class="url-icon">🌍</span>
      <span id="url-text" style="overflow: hidden; text-overflow: ellipsis;">Loading...</span>
    </div>

    <!-- MAIN VIEW -->
    <div id="main-view">
      <button id="scan-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Scan Current Page
      </button>
      <div id="error-box" class="error-msg"></div>
    </div>

    <!-- LOADING VIEW -->
    <div id="loading-view">
      <div class="loader-container">
        <div class="radar-pulse"></div>
        <div class="loader-text">Running comprehensive analysis...</div>
        <div class="loading-steps">
          <div class="loading-step" data-step="1">Submitting to scan queue</div>
          <div class="loading-step" data-step="2">Extracting page content</div>
          <div class="loading-step" data-step="3">Running 8-engine analysis</div>
          <div class="loading-step" data-step="4">Calibrating results</div>
        </div>
      </div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="results-view">
      <div class="score-hero fade-in-up">
        <div class="score-circle-wrapper">
          <svg class="progress-ring">
            <circle class="progress-ring__bg" cx="40" cy="40" r="35"></circle>
            <circle class="progress-ring__circle" id="score-ring" cx="40" cy="40" r="35"></circle>
          </svg>
          <div class="score-value" id="score-text">--</div>
        </div>
        <div class="score-details">
          <div class="risk-badge" id="risk-badge">
            <span class="status-indicator"></span>
            Unscanned
          </div>
          <div class="grade-text">Grade <strong id="grade-text">--</strong></div>
        </div>
      </div>

      <div class="stats-grid fade-in-up">
        <div class="stat-card">
          <div class="stat-val" id="total-patterns" style="color: var(--text-main);">0</div>
          <div class="stat-label">Patterns Found</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="high-risk-patterns" style="color: var(--critical);">0</div>
          <div class="stat-label">High/Critical Risk</div>
        </div>
      </div>

      <div class="top-findings fade-in-up" id="findings-container">
        <h3>Top Findings</h3>
        <div id="findings-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <a href="http://localhost:5000" target="_blank" class="footer-link fade-in-up">
        Open Full Dashboard &rarr;
      </a>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
